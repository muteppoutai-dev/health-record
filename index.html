<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>健康記録</title>
  <link rel="manifest" href="manifest.json">
  <link rel="stylesheet" href="style.css">
</head>
<body>
  <div class="container">
    <h2>今日の記録</h2>

    <div class="section">
      <h3>食事</h3>
      <label>開始: <input type="time" id="meal-start"></label>
      <label>終了: <input type="time" id="meal-end"></label>
    </div>

    <div class="section toggles">
      <label><input type="checkbox" id="meds"> 薬</label>
      <label><input type="checkbox" id="alcohol"> アルコール</label>
      <label><input type="checkbox" id="caffeine"> カフェイン</label>
    </div>

    <div id="meds-area" class="section hidden">
      <h3>薬の詳細</h3>
      <label>服薬タイミング:
        <select id="meds-timing">
          <option value="">選択してください</option>
          <option value="起床時">起床時</option>
          <option value="朝食前">朝食前</option>
          <option value="朝食後">朝食後</option>
          <option value="昼食前">昼食前</option>
          <option value="昼食後">昼食後</option>
          <option value="夕食前">夕食前</option>
          <option value="夕食後">夕食後</option>
          <option value="就寝前">就寝前</option>
        </select>
      </label>
    </div>

    <div id="alcohol-area" class="section hidden">
      <h3>アルコールの詳細</h3>
      <label>種類や量: <input type="text" id="alcohol-detail"></label>
    </div>

    <div id="caffeine-area" class="section hidden">
      <h3>カフェインの詳細</h3>
      <label>種類や量: <input type="text" id="caffeine-detail"></label>
    </div>

    <div class="section">
      <h3>睡眠</h3>
      <label>就寝: <input type="time" id="sleep-start"></label>
      <label>起床: <input type="time" id="sleep-end"></label>
      <label>中途覚醒 (回数や時間): <input type="text" id="sleep-mid"></label>
      <label>眠気レベル:
        <select id="sleep-level">
          <option value="">選択してください</option>
          <option value="1">1 (すっきり)</option>
          <option value="2">2</option>
          <option value="3">3 (普通)</option>
          <option value="4">4</option>
          <option value="5">5 (とても眠い)</option>
        </select>
      </label>
    </div>

    <div class="section">
      <h3>メモ</h3>
      <textarea id="memo" rows="3"></textarea>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
